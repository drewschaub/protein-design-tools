# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Core install only (NumPy, no optional backends).  This is the configuration
  # the pure-NumPy metrics and the file readers must keep working in.
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pytest-cov

    - name: Lint with Flake8
      run: |
        flake8 protein_design_tools tests

    - name: Format Check with Black
      run: |
        black --check protein_design_tools tests

    - name: Run Tests with Coverage
      run: |
        pytest --verbose --cov=protein_design_tools --cov-report=xml tests/

    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # Ensure you add this secret in your repo settings
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # Every optional backend installed (CPU wheels), so the PyTorch / JAX /
  # requests tests actually run instead of being skipped.
  optional-backends:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev,all]"

    - name: Run Tests
      run: |
        pytest --verbose tests/

  # Sphinx build with warnings as errors, so the docs cannot silently rot.
  docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . -r docs/requirements.txt

    - name: Build docs
      run: |
        sphinx-build -W --keep-going -b html docs docs/_build/html
